<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Name</title>
  <style>
    body {
      max-width: 640px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: system-ui, sans-serif;
      background: #fff5f7;
      color: #2a1a1e;
    }
    h1 { font-size: 48px; color: #ec3750; }
    a { color: #ec3750; margin-right: 12px; }
    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .card {
      display: block;
      margin: 0;
      padding: 16px;
      border: 3px solid #2a1a1e;
      border-radius: 10px;
      background: white;
      color: inherit;
      text-decoration: none;
    }
    .card:hover { box-shadow: 4px 4px 0 #2a1a1e; }
  </style>
</head>
<body>
  <h1>Hi, I'm Your Name!</h1>
  <p>Grade 10 at John Fraser. I like building robots and drawing.</p>

  <h2>Stuff I like</h2>
  <ul>
    <li>Smash Ultimate</li>
    <li>3D printing</li>
    <li>Cinnamoroll</li>
  </ul>

  <h2>Find me</h2>
  <a href="https://github.com/yourname">GitHub</a>
  <a href="mailto:you@example.com">Email</a>

  <h2>Projects</h2>
  <div class="projects">
    <a class="card" href="https://github.com/yourname/led-heart">
      <b>LED heart</b>
      <p>My first circuit, built at CS club.</p>
    </a>
    <a class="card" href="https://github.com/yourname/fan">
      <b>Arduino fan</b>
      <p>A fan you control with a knob.</p>
    </a>
  </div>
</body>
</html>
